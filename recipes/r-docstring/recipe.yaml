schema_version: 1

context:
  version: "1.0.0"

package:
  name: r-docstring
  version: ${{ version }}

source:
  url:
    - https://cloud.r-project.org/src/contrib/docstring_${{ version }}.tar.gz
    - https://cloud.r-project.org/src/contrib/Archive/docstring/docstring_${{ version }}.tar.gz
  sha256: 14528bc85bbb299fb8fe1a7116034f8df49ae0c26fb299376185b5d56176e5a7

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-roxygen2
  run:
    - r-base
    - r-roxygen2
    # - r-devtools  # suggested
    # - r-rstudioapi  # suggested
    # - r-knitr  # suggested
    # - r-rmarkdown  # suggested

tests:
  - r:
      libraries:
        - docstring

about:
  homepage: https://github.com/dasonk/docstring
  summary: Provides Docstring Capabilities to R Functions
  description: |-
    Provides the ability to display something analogous to
    Python's docstrings within R.  By allowing the user to document
    their functions as comments at the beginning of their function
    without requiring putting the function into a package we allow
    more users to easily provide documentation for their functions.
    The documentation can be viewed just like any other help files
    for functions provided by packages as well.
  license: GPL-2.0-only
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
  repository: https://github.com/dasonk/docstring

extra:
  recipe-maintainers:
    - Minh-AnhHuynh
